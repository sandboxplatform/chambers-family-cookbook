<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>The Chambers Family Cookbook · The Book</title>
<link rel="icon" href="icons/icon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Figtree:wght@400;500;600;700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;1,8..60,400&family=Caveat:wght@500;700&display=swap">
<style>
/* The book is designed at its print trim, 8 × 10 in = 768 × 960 CSS px. On screen each sheet is
   scaled into the page-turning viewer; in print every sheet is one PDF page. */
:root{
  --paper:#fbf8f1; --paper-2:#f3eee3; --ink:#1c2540; --ink-2:#47506b; --ink-3:#6b7287; --rule:#d9d2c3; --ruled:#c7d7ea; --red:#cf4237;
  --night:#141a2c; --cream:#f4eee2; --cream-2:#d8d2c4; --warm:#f0c9a0;
  --f-display:"Young Serif",Georgia,serif; --f-serif:"Source Serif 4",Georgia,serif; --f-body:"Figtree",system-ui,sans-serif; --f-hand:"Caveat",cursive;
  --c-app:#a8741c; --c-sal:#4c7a2e; --c-soup:#2f6495; --c-main:#9a3d2e; --c-bread:#8f6330; --c-des:#9c3f68; --c-cond:#6f6214;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:#1b1d24;color:var(--cream);font-family:var(--f-body);-webkit-font-smoothing:antialiased}
button{font:inherit}

/* ---------- reader chrome ---------- */
.bar{position:fixed;inset:0 0 auto 0;z-index:5;display:flex;align-items:center;gap:8px;padding:10px 16px;padding-top:max(10px,env(safe-area-inset-top));background:#1b1d24}
.bar a,.bar button{display:inline-flex;align-items:center;gap:6px;min-height:40px;padding:8px 12px;border-radius:999px;border:1px solid #3a3d4a;background:#23262f;color:var(--cream);text-decoration:none;font-size:.88rem;font-weight:500;cursor:pointer}
.bar a:hover,.bar button:hover{border-color:#6a6f82}
.bar svg{width:16px;height:16px;flex:none}
.bar .title{font-family:var(--f-display);font-size:1.05rem;margin:0 auto 0 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar .pos{font-size:.85rem;color:#b9b4a8;min-width:7.5em;text-align:center;font-variant-numeric:tabular-nums}
.bar .icon{padding:8px;width:40px;justify-content:center}
@media (max-width:640px){.bar .title,.bar .label{display:none}.bar{gap:6px}.bar .pos{min-width:auto;margin-left:auto}}
#stage{position:fixed;inset:60px 0 0 0;display:grid;place-items:center;padding:12px 16px 20px}
#flip{width:min(96vw,calc((100vh - 100px) * 1.6));max-width:1600px}
@media (max-width:820px){#flip{width:min(94vw,calc((100vh - 100px) * .8))}}
#flip .page{background:var(--paper);overflow:hidden}
#flip .sheet{transform:scale(var(--k,1));transform-origin:0 0}
.loading{position:fixed;inset:0;display:grid;place-items:center;color:#b9b4a8;font-size:.95rem;z-index:4;background:#1b1d24}
.loading[hidden]{display:none}
.hint{position:fixed;bottom:10px;left:0;right:0;text-align:center;font-size:.8rem;color:#8b8779;pointer-events:none}

/* the measuring room: sheets are laid out here at full size, then copied into the viewer */
#print{position:absolute;left:-30000px;top:0}
#print .page{width:768px;height:960px;overflow:hidden;background:var(--paper);margin-bottom:40px}

/* ---------- the sheet ---------- */
.sheet{width:768px;height:960px;position:relative;overflow:hidden;background:var(--paper);color:var(--ink);font-family:var(--f-body)}
.folio{position:absolute;bottom:40px;font:500 12px/1 var(--f-body);letter-spacing:.12em;color:var(--ink-3)}
.left .folio{left:64px}.right .folio{right:64px}
.eyebrow{font:600 11.5px/1.2 var(--f-body);letter-spacing:.24em;text-transform:uppercase}
.running{position:absolute;top:44px;left:64px;right:64px;display:flex;justify-content:space-between;gap:16px;font:600 11px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);padding-bottom:12px;border-bottom:1px solid var(--rule)}
.running b{color:var(--sec);font-weight:600;white-space:nowrap}
.running span{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* cover */
.cover{background:var(--night);color:var(--cream);display:flex;flex-direction:column}
.cover .photo{position:relative;height:596px;flex:none;overflow:hidden;background:#2a2f40}
.cover .photo img{width:100%;height:100%;object-fit:cover;object-position:50% 42%;display:block}
.cover .tag{position:absolute;left:48px;top:44px;background:var(--cream);color:var(--night);padding:10px 14px;font:600 11px/1 var(--f-body);letter-spacing:.22em;text-transform:uppercase}
.cover .band{height:6px;background:#d9533f;flex:none}
.cover .words{flex:1;display:flex;flex-direction:column;justify-content:center;gap:18px;padding:40px 56px 48px}
.cover h1{margin:0;font:400 66px/1.02 var(--f-display);letter-spacing:-.01em;color:var(--cream)}
.cover .sub{font:600 12px/1.2 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:#c9c2b4}
.ded{display:flex;align-items:center;gap:18px}
.ded i{width:56px;height:3px;background:#d9533f;display:block}
.ded span{font:700 36px/1 var(--f-hand);color:var(--warm)}
.back{background:var(--night);color:var(--cream);padding:96px 80px 72px;display:flex;flex-direction:column;gap:44px}
.back .lead{margin:0;font:400 34px/1.32 var(--f-display);text-wrap:balance}
.back p{margin:0;font-size:19px;line-height:1.6;color:var(--cream-2);max-width:560px}
.back .secs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px 32px;border-top:1px solid #3a4260;padding-top:30px;font-size:16px;font-weight:500}
.back .foot{margin-top:auto;display:flex;justify-content:space-between;align-items:flex-end}

/* endpapers, title, introduction */
.mosaic{background:var(--night);display:grid;grid-template-columns:repeat(3,minmax(0,1fr));grid-template-rows:repeat(3,minmax(0,1fr));gap:6px}
.mosaic img{width:100%;height:100%;object-fit:cover;display:block}
.mosaic .ded-card{background:var(--cream);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:24px;text-align:center}
.mosaic .ded-card small{font:600 10px/1 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:#5b5a52}
.mosaic .ded-card b{font:700 44px/.95 var(--f-hand);color:var(--red)}
.mosaic .ded-card i{width:40px;height:3px;background:var(--red);display:block}
.mosaic .ded-card span{font:400 15px/1.35 var(--f-display);color:var(--ink)}
.titlepage{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:26px;padding:96px}
.titlepage h1{margin:0;font:400 64px/1.05 var(--f-display);color:var(--ink)}
.titlepage .orn{width:72px;height:3px;background:var(--red)}
.titlepage p{margin:0;font:italic 400 20px/1.5 var(--f-serif);color:var(--ink-2)}
.intro-pg{padding:96px 96px 0}
.intro-pg h2{margin:0 0 28px;font:400 40px/1.1 var(--f-display)}
.intro-pg p{margin:0 0 18px;font:400 18px/1.65 var(--f-serif);color:var(--ink);max-width:560px}
.intro-pg p.first::first-letter{font:400 64px/.8 var(--f-display);float:left;margin:8px 10px 0 0;color:var(--red)}
.intro-pg .plate{position:absolute;left:0;right:0;bottom:0;height:400px;overflow:hidden;background:var(--paper-2)}
.intro-pg .plate img{width:100%;height:100%;object-fit:cover;display:block}
.intro-pg .plate .credit{position:absolute;right:16px;bottom:14px;padding:6px 9px;background:rgba(20,26,44,.72);color:#f4eee2;font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.intro-pg .note{margin-top:36px;padding-top:18px;border-top:1px solid var(--rule);font:400 13px/1.55 var(--f-body);color:var(--ink-3)}

/* contents */
.contents{padding:96px 80px 96px}
.contents h2{margin:0 0 32px;font:400 44px/1 var(--f-display)}
.toc{display:flex;flex-direction:column}
.toc .sec{display:flex;align-items:baseline;gap:14px;margin:18px 0 6px;font:600 12px/1.2 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--sec)}
.toc .sec:first-child{margin-top:0}
.toc .sec em{font:400 22px/1 var(--f-display);font-style:normal;letter-spacing:0}
.toc a,.dlist a{display:flex;align-items:baseline;gap:8px;padding:5px 0;color:var(--ink);text-decoration:none;font:400 16px/1.35 var(--f-serif)}
.toc a::after,.dlist a::after{content:"";order:1;flex:1;border-bottom:1px dotted #b9b2a3;transform:translateY(-4px)}
.toc a b,.dlist a b{order:2;font:500 13px/1 var(--f-body);color:var(--ink-3);font-variant-numeric:tabular-nums}
#flip .toc a:hover,#flip .dlist a:hover{color:var(--red)}

/* section dividers */
.div-l{background:var(--sec);color:var(--cream);padding:72px}
.div-l .num{position:absolute;left:56px;top:40px;font:400 340px/1 var(--f-display);color:rgba(255,255,255,.16)}
.div-l h2{position:absolute;left:72px;right:72px;bottom:120px;margin:0;font:400 64px/1.02 var(--f-display);color:var(--cream)}
.div-l .eyebrow{position:absolute;left:72px;bottom:84px;color:rgba(255,255,255,.85)}
.div-r{padding:120px 80px 96px}
.div-r .eyebrow{color:var(--sec);margin-bottom:18px}
.div-r h3{margin:0 0 36px;font:400 34px/1.15 var(--f-display);color:var(--ink)}
.dlist{display:flex;flex-direction:column}

/* recipe opener (left) */
.opener .photo{position:relative;height:var(--ph,560px);overflow:hidden;background:var(--paper-2)}
.opener .photo img{width:100%;height:100%;object-fit:cover;display:block}
.opener .credit{position:absolute;right:16px;bottom:14px;padding:6px 9px;background:rgba(20,26,44,.72);color:#f4eee2;font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.opener .words{padding:40px 64px 0}
.opener .eyebrow{color:var(--sec)}
.opener h2{margin:12px 0 0;font:400 var(--tsize,48px)/1.06 var(--f-display);color:var(--ink);text-wrap:balance}
.opener .intro{margin:20px 0 0;font:italic 400 18px/1.55 var(--f-serif);color:var(--ink-2);max-width:600px;text-wrap:pretty}
.opener .serves{display:inline-flex;margin-top:22px;gap:10px;align-items:center;font:600 11.5px/1 var(--f-body);letter-spacing:.2em;text-transform:uppercase;color:var(--ink-2)}
.opener .serves i{width:28px;height:2px;background:var(--sec);display:block}
.opener.nophoto .words{padding-top:220px}
.opener.nophoto::before{content:"";position:absolute;left:64px;top:150px;width:72px;height:4px;background:var(--sec)}

/* recipe method (right, plus continuations) */
.method{padding:96px 64px 88px}
.method .cols{position:absolute;top:96px;bottom:88px;left:64px;right:64px;display:grid;grid-template-columns:220px minmax(0,1fr);gap:40px}
.method.cont .cols{top:96px}
.col{overflow:hidden;min-height:0}
.col h3{margin:0 0 calc(14px * var(--fs,1));font:400 calc(22px * var(--fs,1))/1.1 var(--f-display);color:var(--ink)}
.ingr ul{list-style:none;margin:0;padding:0}
.ingr li{padding:calc(6px * var(--fs,1)) 0;border-bottom:1px solid var(--rule);font:400 calc(14.5px * var(--fs,1))/1.38 var(--f-body);color:var(--ink)}
.ingr li.grp{border-bottom:0;padding:calc(16px * var(--fs,1)) 0 4px;font:600 calc(11px * var(--fs,1))/1.2 var(--f-body);letter-spacing:.18em;text-transform:uppercase;color:var(--sec)}
.ingr li.grp:first-child{padding-top:2px}
.meth h4{display:flex;align-items:baseline;gap:12px;margin:calc(15px * var(--fs,1)) 0 calc(5px * var(--fs,1));font:600 calc(15px * var(--fs,1))/1.3 var(--f-body);color:var(--ink)}
.meth h4:first-of-type{margin-top:2px}
.meth h4 em{font:400 calc(26px * var(--fs,1))/1 var(--f-display);font-style:normal;color:var(--sec);min-width:22px}
.meth p{margin:0 0 calc(8px * var(--fs,1));font:400 calc(14.75px * var(--fs,1))/1.52 var(--f-body);color:var(--ink);text-wrap:pretty}
.meth.flat{counter-reset:st}
.meth.flat p{position:relative;padding-left:34px;margin-bottom:calc(12px * var(--fs,1))}
.meth.flat p::before{counter-increment:st;content:counter(st);position:absolute;left:0;top:-3px;font:400 calc(22px * var(--fs,1))/1 var(--f-display);color:var(--sec)}
.meth p.outro{margin-top:calc(18px * var(--fs,1));padding-top:14px;border-top:1px solid var(--rule);padding-left:0;font:italic 400 calc(15.5px * var(--fs,1))/1.55 var(--f-serif);color:var(--ink-2)}
.meth p.outro::before{content:none}

/* close-up of the dish under a short method */
.detail{position:absolute;left:0;right:0;bottom:0;overflow:hidden}
.detail img{width:100%;height:100%;object-fit:cover;transform:scale(1.9);transform-origin:52% 58%;display:block}
.has-detail .folio{color:#f4eee2;z-index:1;text-shadow:0 1px 2px rgba(0,0,0,.5)}

/* fillers that keep every recipe opening on a left page */
.bleed img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;transform:scale(1.18);transform-origin:var(--fx,50%) 55%}
.bleed .credit{position:absolute;right:16px;bottom:14px;padding:6px 9px;background:rgba(20,26,44,.72);color:#f4eee2;font:600 10px/1 var(--f-body);letter-spacing:.14em;text-transform:uppercase}
.quote{display:flex;flex-direction:column;justify-content:center;padding:96px 96px 120px}
.quote::before{content:"";width:72px;height:4px;background:var(--sec);margin-bottom:36px}
.quote p{margin:0;font:400 36px/1.3 var(--f-display);color:var(--ink);text-wrap:balance}
.quote small{margin-top:28px;font:600 11.5px/1.2 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--sec)}
.colophon{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:20px;padding:96px}
.colophon span{font:700 52px/1 var(--f-hand);color:var(--red)}
.colophon small{font:600 11px/1.6 var(--f-body);letter-spacing:.24em;text-transform:uppercase;color:var(--ink-3)}

/* ---------- print: one sheet per page at trim size ---------- */
@page{size:8in 10in;margin:0}
@media print{
  html,body{background:#fff}
  .bar,#stage,.loading,.hint{display:none!important}
  #print{position:static;left:auto}
  #print .page{margin:0;break-after:page;page-break-after:always}
  #print .page:last-child{break-after:auto;page-break-after:auto}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
}
</style>
</head>

<script>
(async () => {
"use strict";
const $ = s => document.querySelector(s);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const RELAY = "https://cookbook-relay.chambers-cookbook.workers.dev";

/* ---------- the recipes (same rules as the website's parseBook) ---------- */
const SEC = { "Appetizers": "--c-app", "Salads": "--c-sal", "Soups & Chowders": "--c-soup", "Main Courses": "--c-main", "Bread & Baking": "--c-bread", "Desserts": "--c-des", "Condiments": "--c-cond" };
const slug = s => s.normalize("NFD").replace(/[̀-ͯ]/g, "").toLowerCase().replace(/['’]/g, "").replace(/[^a-z0-9]+/g, "-").replace(/^-|-$/g, "");
function parseBook(txt) {
  const out = []; let cat = "", r = null, grp = null;
  for (const raw of txt.split("\n")) {
    const l = raw.trim(); if (!l) continue;
    const body = l.replace(/^(-:|[#@^>\-=*.!~])\s?/, "");
    if (l.startsWith("# ")) { cat = body; continue; }
    if (l.startsWith("@ ")) { r = { id: slug(body), name: body, cat, aliases: [], serves: "", intro: "", ing: [], steps: [], outro: "" }; out.push(r); grp = null; continue; }
    if (!r) continue;
    if (l.startsWith("~ ")) r.aliases.push(body);
    else if (l.startsWith("^ ")) r.serves = body;
    else if (l.startsWith("> ")) r.intro = body;
    else if (l.startsWith("-:")) r.ing.push({ g: body });
    else if (l.startsWith("- ")) r.ing.push({ t: body });
    else if (l.startsWith("= ")) { grp = { h: body, items: [] }; r.steps.push(grp); }
    else if (l.startsWith("* ")) { if (!grp) { grp = { h: "", items: [] }; r.steps.push(grp); } grp.items.push(body); }
    else if (l.startsWith(". ")) r.outro = body;
  }
  return out;
}
let text = $("#book").textContent;
// Pick up edits made on the website since this page was built (best effort, never blocks for long).
if (/^https?:$/.test(location.protocol)) {
  try {
    const ctl = new AbortController(); const t = setTimeout(() => ctl.abort(), 2500);
    const res = await fetch(RELAY + "/book", { signal: ctl.signal }); clearTimeout(t);
    if (res.ok) { const j = await res.json(); if (typeof j.text === "string" && j.text.includes("@ ")) text = j.text; }
  } catch {}
}
const RECIPES = parseBook(text);
const SECTIONS = [...new Set(RECIPES.map(r => r.cat))];
const IMAGES = (() => { try { return JSON.parse($("#images").textContent || "{}"); } catch { return {}; } })();
function imgFor(r) {
  const keys = [r.id, ...r.aliases];
  for (const k of keys) if (IMAGES[k]?.photo) return { src: IMAGES[k].photo, ai: false };
  for (const k of keys) if (IMAGES[k]?.ai) return { src: IMAGES[k].ai, ai: true };
  return null;
}

/* ---------- building sheets ---------- */
const room = $("#print");
const pages = [];               // in reading order; index 0 = front cover (alone, on the right)
const side = i => i % 2 ? "left" : "right";
function sheet(cls, html, opts = {}) {
  const i = pages.length;
  const page = document.createElement("div");
  page.className = "page"; if (opts.hard) page.dataset.density = "hard";
  page.innerHTML = `<div class="sheet ${side(i)} ${cls}" ${opts.style ? `style="${opts.style}"` : ""}>${html}${opts.folio ? `<div class="folio">${i}</div>` : ""}</div>`;
  room.appendChild(page); if (!opts.dry) pages.push(page);
  return page.firstElementChild;
}
// Every recipe opens on a left page; when one is needed, `filler` adds a page that earns its place.
const padTo = (parity, filler) => { while (pages.length % 2 !== parity) filler(); }; // 1 = next sheet is a left page
const bleedPage = (im, alt, fx) => sheet("bleed", `<img src="${esc(im.src)}" alt="${esc(alt)}">${im.ai ? `<span class="credit">AI-generated image</span>` : ""}`, { style: `--fx:${fx}` });
const secStyle = c => `--sec:var(${SEC[c] || "--ink-2"})`;
const overflows = el => el.scrollHeight > el.clientHeight + 1;

const coverRecipe = RECIPES.find(r => r.id === "nannies-bread" && imgFor(r)) || RECIPES.find(r => imgFor(r));
const coverImg = coverRecipe ? imgFor(coverRecipe) : null;

// 0 · front cover
sheet("cover", `<div class="photo">${coverImg ? `<img src="${esc(coverImg.src)}" alt="">` : ""}<div class="tag">A family recipe book</div></div>
  <div class="band"></div>
  <div class="words"><div class="sub">Recipes handed down through generations</div><h1>The Chambers<br>Family Cookbook</h1><div class="ded"><i></i><span>for Nancy Chambers</span></div></div>`, { hard: true });
// 1 · inside front cover: dishes from across the book around the dedication (designed in Claude Design)
const MOSAIC = ["guacamole", "seafood-chowder-crockpot-version", "moms-classic-scones", "hunters-chicken", null, "roasted-fennel-salad", "christmas-pineapple-cake", "oysters-bienville", "jam-tarts"];
const pool = RECIPES.filter(r => imgFor(r));
let spare = 0;
const tile = id => { let r = RECIPES.find(x => x.id === id || x.aliases.includes(id)); if (!r || !imgFor(r)) r = pool[spare++ % Math.max(pool.length, 1)]; return r ? `<img src="${esc(imgFor(r).src)}" alt="${esc(r.name)}">` : "<div></div>"; };
sheet("mosaic", MOSAIC.map(id => id ? tile(id) : `<div class="ded-card"><small>This book is for</small><b>Nancy Chambers</b><i></i><span>and everyone who<br>gathered at her table</span></div>`).join(""), { hard: true });
// 2 · title  3 · introduction
sheet("titlepage", `<div class="eyebrow" style="color:var(--ink-3)">A family recipe book</div><h1>The Chambers<br>Family Cookbook</h1><div class="orn"></div><p>Recipes handed down through generations</p>`);
const plate = RECIPES.find(r => r.cat === "Desserts" && imgFor(r) && r !== coverRecipe) || RECIPES.find(r => imgFor(r) && r !== coverRecipe);
const plateImg = plate ? imgFor(plate) : null;
const printed = new Date().toLocaleDateString(undefined, { year: "numeric", month: "long", day: "numeric" });
sheet("intro-pg", `<h2>Before you begin</h2>
  <p class="first">Food is more than just nourishment. It's a cherished connection to our past, present, and future.</p>
  <p>Each recipe here carries a piece of family heritage, passed down through generations. Cook from it, write in the margins, and pass it on.</p>
  <div class="note">This edition holds ${RECIPES.length} recipes in ${SECTIONS.length} sections, set from the family's online cookbook on ${esc(printed)}. Pictures marked “AI-generated image” are stand-ins until the family's own photographs replace them.</div>
  ${plateImg ? `<div class="plate"><img src="${esc(plateImg.src)}" alt="${esc(plate.name)}">${plateImg.ai ? `<span class="credit">AI-generated image</span>` : ""}</div>` : ""}`);

// 4… · contents, flowed across as many pages as it needs (page numbers filled in at the end)
const tocRows = [];
SECTIONS.forEach((c, n) => {
  tocRows.push(`<div class="sec" style="${secStyle(c)}"><em>${String(n + 1).padStart(2, "0")}</em>${esc(c)}</div>`);
  RECIPES.filter(r => r.cat === c).forEach(r => tocRows.push(`<a href="#" data-goto="${r.id}"><span>${esc(r.name)}</span><b data-pg="${r.id}"></b></a>`));
});
let tocPage = null, tocList = null;
const newToc = first => { tocPage = sheet("contents", `${first ? "<h2>Contents</h2>" : ""}<div class="toc" style="height:${first ? 700 : 768}px;overflow:hidden"></div>`, { folio: true }); tocList = tocPage.querySelector(".toc"); };
newToc(true);
for (const row of tocRows) {
  tocList.insertAdjacentHTML("beforeend", row);
  if (overflows(tocList)) {
    const el = tocList.lastElementChild; el.remove();
    const orphan = tocList.lastElementChild?.classList.contains("sec") ? tocList.lastElementChild : null; orphan?.remove();
    newToc(false); if (orphan) tocList.appendChild(orphan); tocList.appendChild(el);
  }
}

// sections and recipes
const firstPage = {};
const sectionFiller = () => plate ? bleedPage(imgFor(plate), plate.name, "50%") : sheet("colophon", `<span>for Nancy Chambers</span>`);
SECTIONS.forEach((c, n) => {
  const list = RECIPES.filter(r => r.cat === c);
  padTo(1, sectionFiller);
  sheet("div-l", `<div class="num">${String(n + 1).padStart(2, "0")}</div><h2>${esc(c)}</h2><div class="eyebrow">${list.length} recipe${list.length === 1 ? "" : "s"}</div>`, { style: secStyle(c) });
  sheet("div-r", `<div class="eyebrow">Section ${String(n + 1).padStart(2, "0")}</div><h3>${esc(c)}</h3><div class="dlist">${list.map(r => `<a href="#" data-goto="${r.id}"><span>${esc(r.name)}</span><b data-pg="${r.id}"></b></a>`).join("")}</div>`, { style: secStyle(c), folio: true });
  list.forEach(r => {
    firstPage[r.id] = pages.length;
    // left: photograph and title
    const im = imgFor(r);
    const op = sheet(`opener ${im ? "" : "nophoto"}`, `${im ? `<div class="photo"><img src="${esc(im.src)}" alt="${esc(r.name)}">${im.ai ? `<span class="credit">AI-generated image</span>` : ""}</div>` : ""}
      <div class="words"><div class="eyebrow">${esc(c)}</div><h2>${esc(r.name)}</h2>${r.intro ? `<p class="intro">${esc(r.intro)}</p>` : ""}${r.serves ? `<div class="serves"><i></i>Serves ${esc(r.serves)}</div>` : ""}</div>`, { style: secStyle(c), folio: !im });
    // long titles step down; the photo then takes whatever room the words leave
    const h2 = op.querySelector("h2"); let ts = 48;
    while (h2.offsetHeight > 160 && ts > 34) { ts -= 2; op.style.setProperty("--tsize", ts + "px"); }
    if (im) op.style.setProperty("--ph", Math.max(380, Math.min(640, 880 - op.querySelector(".words").offsetHeight)) + "px");
    // right (and continuations): ingredients beside the method
    const ing = r.ing.map(i => i.g ? `<li class="grp">${esc(i.g)}</li>` : `<li>${esc(i.t)}</li>`);
    const flat = !r.steps.some(g => g.h);
    const meth = [];
    r.steps.forEach((g, gi) => { if (g.h) meth.push(`<h4><em>${gi + 1}</em>${esc(g.h)}</h4>`); g.items.forEach(t => meth.push(`<p>${esc(t)}</p>`)); });
    if (r.outro) meth.push(`<p class="outro">${esc(r.outro)}</p>`);
    const flow = (fs, dry) => {
      const out = [];
      let ingLeft = ing, methLeft = meth, first = true;
      while (first || ingLeft.length || methLeft.length) {
        const pg = sheet(`method ${first ? "" : "cont"}`, `<div class="running"><span>${esc(r.name)}${first ? "" : " · continued"}</span><b>${esc(c)}</b></div>
          <div class="cols"><div class="col ingr">${ingLeft.length ? `${first ? "<h3>Ingredients</h3>" : ""}<ul></ul>` : ""}</div><div class="col meth ${flat ? "flat" : ""}">${methLeft.length && first ? "<h3>Method</h3>" : ""}</div></div>`, { style: `${secStyle(c)};--fs:${fs}`, folio: true, dry });
        out.push(pg);
        const ic = pg.querySelector(".ingr"), ul = ic.querySelector("ul"), mc = pg.querySelector(".meth");
        if (ul) ul.innerHTML = ingLeft.join("");
        mc.insertAdjacentHTML("beforeend", methLeft.join(""));
        if (flat && !first) mc.style.counterReset = `st ${meth.length - methLeft.length}`;
        const ci = [], cm = [];
        while (ul && overflows(ic) && ul.children.length > 1) { ci.unshift(ul.lastElementChild.outerHTML); ul.lastElementChild.remove(); }
        if (ci.length && ul?.lastElementChild?.classList.contains("grp")) { ci.unshift(ul.lastElementChild.outerHTML); ul.lastElementChild.remove(); }
        const items = () => [...mc.children].filter(x => x.tagName !== "H3");
        while (overflows(mc) && items().length > 1) { const x = items().at(-1); cm.unshift(x.outerHTML); x.remove(); }
        if (cm.length && items().at(-1)?.tagName === "H4") { const x = items().at(-1); cm.unshift(x.outerHTML); x.remove(); }
        if (out.length > 6) break; // safety: never loop on content that can't be placed
        ingLeft = ci; methLeft = cm; first = false;
      }
      if (dry) { out.forEach(el => el.parentElement.remove()); return out.length; }
      return out;
    };
    // 0.82 keeps body text at 12px (9pt), the smallest that prints comfortably; 1.24 fills short recipes
    let lo = 0.82, hi = 1.24;
    const fewest = flow(lo, true);
    let fs = lo;
    if (flow(hi, true) === fewest) fs = hi;
    else { for (let k = 0; k < 7; k++) { const mid = (lo + hi) / 2; if (flow(mid, true) === fewest) lo = mid; else hi = mid; } fs = lo; }
    const made = flow(Math.floor(fs * 1000) / 1000, false);
    // a short recipe leaves room: fill it with a close-up of the dish, bled off the bottom of the page
    const last = made.at(-1), cols = last.querySelector(".cols");
    const used = Math.max(...[...cols.querySelectorAll("li,p,h4,h3")].map(x => x.offsetTop + x.offsetHeight), 0);
    const room = cols.clientHeight - used;
    if (im && room > 280) {
      const top = cols.offsetTop + used + 40;
      last.insertAdjacentHTML("beforeend", `<div class="detail" style="top:${top}px"><img src="${esc(im.src)}" alt=""></div>`);
      last.classList.add("has-detail");
    }
    // a recipe that ran onto a left page closes with a second look at the dish (or its closing words)
    padTo(1, () => im ? bleedPage(im, r.name, "35%")
      : sheet("quote", `<p>${esc(r.outro || r.intro || r.name)}</p><small>${esc(r.name)}</small>`, { style: secStyle(c), folio: true }));
  });
});

// the back cover sits alone on a left page
padTo(1, () => sheet("colophon", `<span>for Nancy Chambers</span><small>The Chambers Family Cookbook<br>Set from the family's online cookbook</small>`));
sheet("back", `<div class="ded" style="gap:16px"><i style="width:40px"></i><span class="eyebrow" style="font:600 12px/1.2 var(--f-body);color:#c9c2b4;letter-spacing:.24em">The Chambers Family Cookbook</span></div>
  <p class="lead">Food is more than just nourishment. It's a cherished connection to our past, present, and future.</p>
  <p>Each recipe here carries a piece of family heritage, passed down through generations: the breads and scones, chowders, crêpes and Christmas cakes of the Chambers table.</p>
  <div class="secs">${SECTIONS.map(c => `<div>${esc(c)}</div>`).join("")}</div>
  <div class="foot"><span style="font:700 34px/1 var(--f-hand);color:var(--warm)">for Nancy Chambers</span></div>`, { hard: true });

// page numbers in the contents and section lists
room.querySelectorAll("[data-pg]").forEach(b => b.textContent = firstPage[b.dataset.pg] ?? "");

/* ---------- the page-turning viewer ---------- */
const flipEl = $("#flip");
const clones = pages.map(p => p.cloneNode(true));
clones.forEach(c => flipEl.appendChild(c));
await Promise.all([...room.querySelectorAll("img")].slice(0, 6).map(i => i.decode?.().catch(() => {})));
const pf = new St.PageFlip(flipEl, { width: 768, height: 960, size: "stretch", minWidth: 260, maxWidth: 1600, minHeight: 325, maxHeight: 2000, showCover: true, usePortrait: true, mobileScrollSupport: false, maxShadowOpacity: .45, flippingTime: 850, drawShadow: true });
pf.loadFromHTML(clones);
const scale = () => { const w = clones[0].offsetWidth || clones.find(c => c.offsetWidth)?.offsetWidth; if (w) flipEl.style.setProperty("--k", w / 768); };
const pos = () => { const i = pf.getCurrentPageIndex(), n = pages.length; $("#pos").textContent = i === 0 ? "Cover" : i >= n - 1 ? "Back cover" : `Page ${i} of ${n - 2}`; };
pf.on("flip", () => { pos(); $("#hint").hidden = true; });
pf.on("changeOrientation", () => setTimeout(scale, 30));
pf.on("update", scale);
new ResizeObserver(scale).observe(flipEl);
addEventListener("resize", () => setTimeout(scale, 60));
scale(); pos();
$("#loading").hidden = true;

$("#b-prev").addEventListener("click", () => pf.flipPrev());
$("#b-next").addEventListener("click", () => pf.flipNext());
$("#b-toc").addEventListener("click", () => pf.flip(4));
$("#b-print").addEventListener("click", () => print());
$("#b-full").addEventListener("click", () => document.fullscreenElement ? document.exitFullscreen() : document.documentElement.requestFullscreen?.().catch(() => {}));
addEventListener("keydown", e => { if (e.key === "ArrowRight" || e.key === "PageDown") pf.flipNext(); else if (e.key === "ArrowLeft" || e.key === "PageUp") pf.flipPrev(); else if (e.key === "Home") pf.flip(0); });
flipEl.addEventListener("click", e => { const a = e.target.closest("[data-goto]"); if (!a) return; e.preventDefault(); e.stopPropagation(); pf.flip(firstPage[a.dataset.goto]); }, true);
// open at a recipe: book.html#r-<id>
const goHash = turn => {
  const want = decodeURIComponent(location.hash.replace(/^#r-/, ""));
  const target = RECIPES.find(r => r.id === want || r.aliases.includes(want));
  if (target) { turn ? pf.turnToPage(firstPage[target.id]) : pf.flip(firstPage[target.id]); pos(); }
};
goHash(true);
addEventListener("hashchange", () => goHash(false));
})();
</script>
</body>
</html>
